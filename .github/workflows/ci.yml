name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: O que deseja executar?
        required: true
        type: choice
        default: todos-os-testes
        options:
          - testes-selecionados
          - todos-os-testes
          - testes-e-build
      test_selector:
        description: Selecione classes ou métodos (ex. TransferServiceTest,CpfValidatorTest)
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validando configuração do projeto Maven
        run: mvn --batch-mode validate

      - name: Compilando o projeto com Java 21
        run: mvn --batch-mode -DskipTests compile

      - name: Validate test selection
        if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'testes-selecionados'
        env:
          TEST_SELECTOR: ${{ inputs.test_selector }}
        run: |
          if [ -z "$TEST_SELECTOR" ]; then
            echo "::error::Informe pelo menos uma classe ou método no campo test_selector."
            exit 1
          fi

      - name: Executando os testes selecionados
        if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'testes-selecionados'
        env:
          TEST_SELECTOR: ${{ inputs.test_selector }}
        run: mvn --batch-mode test "-Dtest=$TEST_SELECTOR"

      - name: Executando todos os testes
        if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'todos-os-testes'
        run: mvn --batch-mode test

      - name: Executando todos os testes para build
        if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'testes-e-build'
        run: mvn --batch-mode test

      - name: Executando todos os testes no push ou pull request
        if: github.event_name != 'workflow_dispatch'
        run: mvn --batch-mode test

      - name: Empacotando a aplicação
        if: (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'testes-e-build') || github.event_name != 'workflow_dispatch'
        run: mvn --batch-mode -DskipTests package

      - name: Construindo imagem Docker (sem publicar)
        if: (github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'testes-e-build') || github.event_name != 'workflow_dispatch'
        run: docker build --tag digital-wallet-api:${{ github.sha }} .

      - name: Publicando resumo das etapas
        if: always()
        env:
          EXECUTION_MODE: ${{ inputs.execution_mode }}
        run: |
          {
            echo "## Resumo do workflow"
            echo "- Evento: \`${{ github.event_name }}\`"
            echo "- Modo manual: \`${EXECUTION_MODE:-CI automático}\`"
            echo "- Java: 21"
            echo "- Deploy: não configurado; a imagem Docker foi construída sem publicação."
          } >> "$GITHUB_STEP_SUMMARY"

name: Fintech Transaction API CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Escolha as etapas que deseja executar
        required: true
        type: choice
        default: todos-os-testes
        options:
          - testes-selecionados
          - todos-os-testes
          - testes-e-build
      test_selector:
        description: Classes ou métodos Maven separados por vírgula
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: "1. Construção e validação do projeto"
    runs-on: ubuntu-24.04
    steps:
      - name: Baixando o código-fonte
        uses: actions/checkout@v5

      - name: Configurando Java 21 e cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validando configuração do projeto Maven
        run: mvn --batch-mode --no-transfer-progress validate

      - name: Compilando código da aplicação e dos testes
        run: mvn --batch-mode --no-transfer-progress test-compile

      - name: Empacotando a aplicação Spring Boot
        if: github.event_name != 'workflow_dispatch' || inputs.execution_mode == 'testes-e-build'
        run: mvn --batch-mode --no-transfer-progress package -Dmaven.test.skip=true

  tests:
    name: "2. Testes unitários"
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        (
          github.event_name != 'workflow_dispatch' ||
          inputs.execution_mode == 'testes-selecionados' ||
          inputs.execution_mode == 'todos-os-testes' ||
          inputs.execution_mode == 'testes-e-build'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Baixando o código-fonte
        uses: actions/checkout@v5

      - name: Configurando Java 21 e cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validando seleção de testes
        if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'testes-selecionados'
        env:
          TEST_SELECTOR: ${{ inputs.test_selector }}
        run: |
          if [ -z "$TEST_SELECTOR" ]; then
            echo "::error::Informe classes ou métodos Maven no campo test_selector."
            exit 1
          fi

      - name: Executando testes selecionados
        if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'testes-selecionados'
        env:
          TEST_SELECTOR: ${{ inputs.test_selector }}
        run: mvn --batch-mode --no-transfer-progress test "-Dtest=$TEST_SELECTOR"

      - name: Executando testes unitários
        if: github.event_name != 'workflow_dispatch' || inputs.execution_mode != 'testes-selecionados'
        run: mvn --batch-mode --no-transfer-progress test '-Dtest=!WalletApiIntegrationTest'

  integration:
    name: "3. Testes de integração com PostgreSQL"
    needs: [build, tests]
    if: >-
      ${{
        needs.build.result == 'success' &&
        needs.tests.result == 'success' &&
        (
          github.event_name != 'workflow_dispatch' ||
          inputs.execution_mode == 'todos-os-testes' ||
          inputs.execution_mode == 'testes-e-build'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Baixando o código-fonte
        uses: actions/checkout@v5

      - name: Configurando Java 21 e cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executando testes de integração com PostgreSQL via Testcontainers
        run: mvn --batch-mode --no-transfer-progress test -Dtest=WalletApiIntegrationTest

  acceptance:
    name: "4. Testes de aceitação no ambiente de aplicação"
    needs: [build, tests, integration]
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        needs.tests.result == 'success' &&
        needs.integration.result == 'success' &&
        (
          github.event_name != 'workflow_dispatch' ||
          inputs.execution_mode == 'testes-e-build'
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Baixando o código-fonte
        uses: actions/checkout@v5

      - name: Construindo a imagem Docker da aplicação
        run: docker compose -f docker-compose.yml build api

      - name: Implantando no ambiente temporário para aceitação
        run: docker compose -f docker-compose.yml up -d

      - name: Aguardando a API iniciar
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/v1/wallet || true)
            if [ "$status" = "401" ]; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f docker-compose.yml logs api postgres
              echo "::error::A API não ficou disponível a tempo."
              exit 1
            fi
            sleep 2
          done

      - name: Validando cadastro de conta, autenticação JWT e consulta de saldo
        run: |
          set -euo pipefail

          account=$(curl --fail --silent --show-error \
            --request POST http://localhost:8080/api/v1/accounts \
            --header 'Content-Type: application/json' \
            --data '{"name":"CI Acceptance Test","email":"ci-acceptance@example.com","document":"529.982.247-25","password":"senha-segura"}')
          account_id=$(echo "$account" | jq --exit-status --raw-output '.id')

          login=$(curl --fail --silent --show-error \
            --request POST http://localhost:8080/api/v1/auth/login \
            --header 'Content-Type: application/json' \
            --data '{"email":"ci-acceptance@example.com","password":"senha-segura"}')
          token=$(echo "$login" | jq --exit-status --raw-output '.accessToken')

          curl --fail --silent --show-error \
            "http://localhost:8080/api/v1/accounts/$account_id" \
            --header "Authorization: Bearer $token" |
            jq --exit-status '.balance == 0'

      - name: Encerrando ambiente temporário de aceitação
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans
